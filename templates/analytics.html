<!DOCTYPE html>
<html>

<head>

    <title>Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-5">
        Task Analytics Dashboard
    </h1>

    <div class="row">

        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h1>{{ total_tasks }}</h1>

                <p>Total Tasks</p>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h1>{{ completed_tasks }}</h1>

                <p>Completed Tasks</p>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h1>{{ pending_tasks }}</h1>

                <p>Pending Tasks</p>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h1>{{ high_priority }}</h1>

                <p>High Priority</p>

            </div>

        </div>

    </div>

</div>

</body>
</html> 

<div class="col-md-3">

    <div class="card shadow p-4 text-center">

        <h1>{{ completion_percentage }}%</h1>

        <p>Completion Rate</p>

    </div>

</div>
