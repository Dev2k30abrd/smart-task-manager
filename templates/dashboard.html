<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
        }

        .task-card {
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .navbar {
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark px-4">
        <h3 class="text-white">Smart Task Manager</h3>

        <div>
            <a href="/analytics" class="btn btn-warning">Analytics</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="task-card">
            <h1 class="text-center mb-4">Task Dashboard</h1>

            <!-- Search -->
            <input type="text" id="searchInput" class="form-control mb-4"
                placeholder="Search Tasks..." onkeyup="searchTasks()">

            <!-- Add Task Form -->
            <form action="/add_task" method="POST">

                <input type="text"
                    name="title"
                    class="form-control mb-3"
                    placeholder="Task Title"
                    required>

                <textarea name="description"
                    class="form-control mb-3"
                    placeholder="Task Description"
                    rows="3"
                    required></textarea>

                <input type="date"
                    name="due_date"
                    class="form-control mb-3">

                <select name="priority" class="form-control mb-3">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>

                <button type="submit" class="btn btn-primary w-100">
                    Add Task
                </button>

            </form>
        </div>

        <h1 class="mb-4">All Tasks</h1>

        <div id="taskContainer">

            {% for task in tasks %}

            <div class="task-card task-item">

                <h3>{{ task.title }}</h3>

                <p>{{ task.description }}</p>

                {% if task.due_date %}
                <p>
                    <strong>Due Date:</strong>
                    {{ task.due_date }}
                </p>
                {% endif %}

                <span class="badge bg-danger">
                    {{ task.priority }}
                </span>

                <span class="badge bg-secondary">
                    {{ task.status }}
                </span>

                <br><br>

                <a href="/toggle_status/{{ task.id }}"
                    class="btn btn-success">
                    Toggle Status
                </a>

                <a href="/delete_task/{{ task.id }}"
                    class="btn btn-danger">
                    Delete
                </a>

            </div>

            {% endfor %}

        </div>

    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        const socket = io();

        socket.on('connect', function () {
            console.log("Socket Connected");
        });

        socket.on('task_added', function (data) {
            console.log(data.message);
            alert(data.message);
        });

        function searchTasks() {

            let input = document.getElementById('searchInput').value.toLowerCase();

            let tasks = document.getElementsByClassName('task-item');

            for (let i = 0; i < tasks.length; i++) {

                let text = tasks[i].innerText.toLowerCase();

                if (text.includes(input)) {
                    tasks[i].style.display = "block";
                } else {
                    tasks[i].style.display = "none";
                }
            }
        }
    </script>

</body>

</html>
